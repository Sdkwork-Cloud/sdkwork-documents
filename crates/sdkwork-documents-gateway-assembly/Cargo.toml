[package]
name = "sdkwork-documents-gateway-assembly"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Generated gateway assembly for sdkwork-documents application HTTP plane."

[lib]
name = "sdkwork_documents_gateway_assembly"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
sdkwork_routes_documents_app_api = { package = "sdkwork-routes-documents-app-api", path = "../sdkwork-routes-documents-app-api" }
sdkwork_routes_documents_backend_api = { package = "sdkwork-routes-documents-backend-api", path = "../sdkwork-routes-documents-backend-api" }
sdkwork_routes_documents_open_api = { package = "sdkwork-routes-documents-open-api", path = "../sdkwork-routes-documents-open-api" }
