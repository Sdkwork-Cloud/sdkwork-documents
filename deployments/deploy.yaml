version: 2
defaultProfile: cloud.production
profiles:
  cloud.development:
    deployment:
      deploymentProfile: cloud
      environment: development
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: doc-dev.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-admin-dev.sdkwork.com
          - documents-dev.sdkwork.com
          - documents-open-dev.sdkwork.com
      - domain: documents-admin-dev.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-dev.birdcoder.com
          - documents-open-dev.birdcoder.com
      - domain: documents-admin-dev.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: adaptive
        aliases:
          - documents-dev.dtupay.com
          - documents-open-dev.dtupay.com
      - domain: documents-admin-dev.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: adaptive
        aliases:
          - documents-dev.sdkwork.cn
          - documents-open-dev.sdkwork.cn
      - domain: documents-admin-dev.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: adaptive
        aliases:
          - documents-dev.birdcoder.cn
          - documents-open-dev.birdcoder.cn
      - domain: documents-admin-dev.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: adaptive
        aliases:
          - documents-dev.dtupay.cn
          - documents-open-dev.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.development
        env: etc/topology/cloud.development.env
