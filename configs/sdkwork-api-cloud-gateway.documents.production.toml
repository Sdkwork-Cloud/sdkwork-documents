mode = "embedded"

[service]
name = "sdkwork-api-cloud-gateway"
environment = "production"

[server]
bind = "0.0.0.0:3900"

[[dependencySurfaces]]
serviceId = "sdkwork-documents-app-api"
workspace = "sdkwork-documents"
sdkFamily = "sdkwork-documents-app-sdk"
apiAuthority = "sdkwork-documents.app"
surface = "app"
apiPrefix = "/app/v3/api/documents"
runtimeMode = "split"
sameOriginAllowed = true
requiredBaseUrlKey = "SDKWORK_DOCUMENTS_APPLICATION_PUBLIC_HTTP_URL"
coverage = "documents-app-api-upstream-routes"

[[dependencySurfaces]]
serviceId = "sdkwork-documents-backend-api"
workspace = "sdkwork-documents"
sdkFamily = "sdkwork-documents-backend-sdk"
apiAuthority = "sdkwork-documents.backend"
surface = "backend"
apiPrefix = "/backend/v3/api/documents"
runtimeMode = "split"
sameOriginAllowed = true
requiredBaseUrlKey = "SDKWORK_DOCUMENTS_APPLICATION_BACKEND_HTTP_URL"
coverage = "documents-backend-api-upstream-routes"

[[dependencySurfaces]]
serviceId = "sdkwork-documents-open-api"
workspace = "sdkwork-documents"
sdkFamily = "sdkwork-documents-sdk"
apiAuthority = "sdkwork-documents-open-api"
surface = "open"
apiPrefix = "/doc/v3/api"
runtimeMode = "split"
sameOriginAllowed = true
requiredBaseUrlKey = "SDKWORK_DOCUMENTS_APPLICATION_OPEN_HTTP_URL"
coverage = "documents-open-api-upstream-routes"

[[upstreams]]
serviceId = "sdkwork-documents-app-api"
baseUrl = "https://documents.sdkwork.com"

[[upstreams]]
serviceId = "sdkwork-documents-backend-api"
baseUrl = "https://documents-admin.sdkwork.com"

[[upstreams]]
serviceId = "sdkwork-documents-open-api"
baseUrl = "https://doc.sdkwork.com"

[cors]
allowAnyOrigin = false
allowedOrigins = ["https://documents.sdkwork.com", "https://documents-admin.sdkwork.com"]

[request]
maxBodyBytes = 33554432
timeoutMs = 0

[readiness]
checkUpstreams = true
timeoutMs = 1000

[observability]
accessLogEnabled = true
auditLogEnabled = true
accessLogSampleRateBasisPoints = 10000
auditLogSampleRateBasisPoints = 10000
metricsEnabled = true
metricsPath = "/metrics"
tracingEnabled = true
redactHeaders = ["authorization", "access-token", "cookie", "x-api-key", "set-cookie"]

[diagnostics]
enabled = false
path = "/internal/gateway/diagnostics"
includePolicyInventory = true
includeRouteInventory = true

[security]
allowedHosts = ["api.sdkwork.com", "documents.sdkwork.com", "documents-admin.sdkwork.com", "doc.sdkwork.com"]
trustedProxyCidrs = []
secureHeadersEnabled = true
maxHeaderBytes = 65536
maxHeaderCount = 128
rejectCredentialHeadersOnAnonymousAuthRoutes = true
csrfGuardEnabled = true

[security.waf]
enabled = true
mode = "enforce"
inspectQuery = true
inspectHeaders = true
inspectJsonBody = true

[traffic]
rateLimitEnabled = true
compatXRateLimitHeaders = true
globalMaxInFlight = 1024
rateLimits = []
concurrencyLimits = []

[policy]
enabled = true
dryRun = false
rules = []

[resilience]
retryEnabled = true
maxAttempts = 2
retryStatuses = [502, 503, 504]
retryBackoffMs = 100
circuitBreakerEnabled = true
failureThreshold = 5
openSeconds = 30
halfOpenMaxAttempts = 1
